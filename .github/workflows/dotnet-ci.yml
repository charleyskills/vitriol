name: .NET CI

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Print SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore Vitriol.slnx

      - name: Build
        run: dotnet build Vitriol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Vitriol.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: dotnet/TestResults/
          retention-days: 7
